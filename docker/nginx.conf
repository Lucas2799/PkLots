# =========================================
# PkLots - Gateway Nginx (app web + proxy da API)
# Copiado como template (/etc/nginx/templates/default.conf.template):
# o entrypoint da imagem oficial substitui ${NGINX_LOCAL_RESOLVERS}
# e o resultado é incluído no bloco http do nginx.conf padrão.
# =========================================

# Re-resolve os nomes dos containers (o IP muda quando um container é recriado)
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

client_max_body_size 20M;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml+rss;

# =========================================
# Rate Limiting
# =========================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# =========================================
# Upstream - Serviços Internos
# =========================================
upstream pklots_api {
    zone pklots_api 64k;
    server pklots-backend:8080 resolve;
}

server {
    listen 80;
    server_name _;

    # Health check do próprio gateway
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Redirecionar para HTTPS (ativar em produção junto com o bloco 443)
    # return 301 https://$host$request_uri;

    # API e documentação (antes das regras de arquivos estáticos: regex vale na ordem)
    location ~ ^/(api|swagger)(/|$) {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://pklots_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # App Flutter (web) - SPA
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos do app: o Flutter não versiona os nomes (main.dart.js, fontes de ícones
    # reduzidas a cada build etc.), então o navegador sempre revalida (ETag → 304)
    location ~* \.(html|js|mjs|wasm|json|css|bin|frag|png|webp|jpg|svg|ico|ttf|otf|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

}

