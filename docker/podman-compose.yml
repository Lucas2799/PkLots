# =========================================
# PkLots - ambiente completo em containers
#
# Uso (a partir da raiz do projeto):
#   cp docker/.env.example docker/.env   # ajuste senhas e chave JWT
#   podman compose -f docker/podman-compose.yml up -d --build
#
# Gateway (API via Nginx): http://localhost:${GATEWAY_PORTA:-8000}
# =========================================

services:
  # =========================================
  # 1. PostgreSQL 16 (Banco de Dados)
  # =========================================
  pklots-db:
    image: docker.io/library/postgres:16-alpine
    container_name: pklots-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:-pklots_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:-SenhaForteAqui123!}
      POSTGRES_DB: ${POSTGRES_BANCO:-pklots_core}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Exposto só no localhost, para migrations e ferramentas de desenvolvimento
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pklots-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================
  # 2. Redis 7 (Cache + Ocupação em Tempo Real)
  # =========================================
  pklots-cache:
    image: docker.io/library/redis:7-alpine
    container_name: pklots-redis
    # Sem porta publicada: acessível apenas pela rede interna
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - pklots-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================
  # 3. Microsserviço Python (EasyOCR + LPR)
  # =========================================
  pklots-lpr:
    build:
      context: ../src/python
      dockerfile: ../../docker/Dockerfile.lpr
    image: localhost/pklots-lpr:latest
    container_name: pklots-python-lpr
    ports:
      # Só no localhost, para testes (página de teste em http://localhost:5000/)
      - "127.0.0.1:${LPR_PORTA:-5000}:5000"
    networks:
      - pklots-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # =========================================
  # 4. Backend .NET (Minimal API)
  # =========================================
  pklots-backend:
    build:
      context: ../src/.net
      dockerfile: ../../docker/Dockerfile.api
    image: localhost/pklots-api:latest
    container_name: pklots-dotnet-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${AMBIENTE:-Production}
      ConnectionStrings__DefaultConnection: "Host=pklots-db;Port=5432;Database=${POSTGRES_BANCO:-pklots_core};Username=${POSTGRES_USUARIO:-pklots_admin};Password=${POSTGRES_SENHA:-SenhaForteAqui123!};"
      ConnectionStrings__RedisConnection: pklots-cache:6379
      Services__LprServiceUrl: http://pklots-lpr:5000
      Swagger__Habilitado: ${SWAGGER_HABILITADO:-true}
      Jwt__SecretKey: ${JWT_CHAVE:-sua_chave_secreta_super_segura_minimo_32_caracteres_aleatorios}
    ports:
      - "127.0.0.1:${API_PORTA:-8080}:8080"
    volumes:
      - api_logs:/app/logs
    depends_on:
      pklots-db:
        condition: service_healthy
      pklots-cache:
        condition: service_healthy
    networks:
      - pklots-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # =========================================
  # 5. Reverse Proxy / API Gateway (Nginx)
  # =========================================
  pklots-gateway:
    image: docker.io/library/nginx:alpine
    container_name: pklots-nginx
    ports:
      # Porta alta: Podman rootless não publica portas < 1024
      - "${GATEWAY_PORTA:-8000}:80"
    environment:
      # Gera NGINX_LOCAL_RESOLVERS a partir do DNS do container (usado no template)
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro,Z
    depends_on:
      pklots-backend:
        condition: service_healthy
    networks:
      - pklots-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  pklots-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  api_logs:
