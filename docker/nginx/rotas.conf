# Rotas do app web e proxy da API (iguais em HTTP e HTTPS)

include /etc/nginx/pklots/cabecalhos-seguranca.conf;

location = /health {
    access_log off;
    default_type text/plain;
    return 200 "OK";
}

# API e documentação (antes das regras de arquivos estáticos: regex vale na ordem)
location ~ ^/(api|swagger)(/|$) {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://pklots_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Só o IP que o gateway enxerga (cabeçalho enviado pelo cliente é descartado)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
}

# App Flutter (web) - SPA
root /usr/share/nginx/html;

location / {
    try_files $uri $uri/ /index.html;
}

# Arquivos do app: o Flutter não versiona os nomes (main.dart.js, fontes reduzidas a cada build etc.),
# então o navegador sempre revalida (ETag → 304)
location ~* \.(html|js|mjs|wasm|json|css|bin|frag|png|webp|jpg|svg|ico|ttf|otf|woff2?)$ {
    include /etc/nginx/pklots/cabecalhos-seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
