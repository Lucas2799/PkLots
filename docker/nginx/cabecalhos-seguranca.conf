# Cabeçalhos de segurança. Incluído no servidor e em toda location que tem add_header,
# porque um add_header na location descarta os herdados do servidor.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
# Navegador passa a usar só HTTPS neste domínio por 1 ano (ignorado em respostas HTTP)
add_header Strict-Transport-Security "max-age=31536000" always;
